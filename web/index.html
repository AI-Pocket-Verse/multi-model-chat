<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>多模型 AI 并行对话</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      // 首屏皮肤：必须在 CSS 之前跑，否则会先用默认皮肤渲染再跳到用户选的那套（闪一下）。
      // key 必须与 @multi-model-chat/design-tokens 的 SKIN_STORAGE_KEY 一致。
      try {
        document.documentElement.dataset.skin = localStorage.getItem('multi-model-chat.skin') || 'a'
      } catch (e) {
        document.documentElement.dataset.skin = 'a'
      }
      // 首屏语言：与 web/src/i18n/index.ts 的 LANG_STORAGE_KEY / detectLang 保持一致。
      try {
        var lang = localStorage.getItem('multi-model-chat.lang')
        if (lang !== 'zh' && lang !== 'en') {
          lang = /^zh\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || '') ? 'zh' : 'en'
        }
        if (lang === 'en') {
          document.documentElement.lang = 'en'
          document.title = 'Multi-Model Chat'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
